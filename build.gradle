buildscript {
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}

plugins {
    id 'java-gradle-plugin'
    id "com.gradle.plugin-publish" version "$pluginPublishVersion"
    id "io.github.ben-manes.versions" version "$versionsPluginVersion"
}

group = 'dev.capybaralabs'
// version lives in gradle.properties, releases override it with -Pversion=<tag>

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

testing {
    suites {
        functionalTest(JvmTestSuite) {
            useJUnitJupiter("$junitVersion")
            dependencies {
                implementation "org.assertj:assertj-core:$assertjVersion"
            }
        }
    }
}

gradlePlugin {
    website = 'https://github.com/CapybaraLabs/gradle-dependency-sources-plugin'
    vcsUrl = 'https://github.com/CapybaraLabs/gradle-dependency-sources-plugin.git'
    testSourceSets(sourceSets.functionalTest)
    plugins {
        dependencySources {
            id = 'dev.capybaralabs.dependency-sources'
            implementationClass = 'dev.capybaralabs.depsources.gradle.DependencySourcesPlugin'
            displayName = 'Dependency Sources'
            description = 'Unpack the sources of all dependencies so they become greppable for humans and AI agents.'
            tags = ['sources', 'dependencies', 'grep', 'ai', 'agents']
        }
    }
}

tasks.named('check') {
    dependsOn testing.suites.functionalTest
}

tasks.named('javadoc') {
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

dependencyLocking {
    lockAllConfigurations()
}

// ./gradlew resolveAndLockAll --write-locks
tasks.register('resolveAndLockAll') {
    doFirst {
        assert gradle.startParameter.writeDependencyLocks
    }
    doLast {
        configurations.all {
            resolutionStrategy {
                componentSelection properReleasesOnly()
            }
        }
        configurations
                .matching { it.canBeResolved }
                .each { it.resolve() }
    }
}

// https://github.com/ben-manes/gradle-versions-plugin
dependencyUpdates.resolutionStrategy {
    componentSelection properReleasesOnly()
}

tasks.register("outdated") {
    dependsOn dependencyUpdates
}

static def properReleasesOnly() {
    return { rules ->
        rules.all { ComponentSelection selection ->
            boolean rejected = ['alpha', 'beta', 'rc', 'preview', 'm1', 'm2', 'm3', 'cr1'].any {
                q -> selection.candidate.version.toLowerCase().contains(q)
            }
            if (rejected) {
                selection.reject('Release candidate')
            }
        }
    }
}
